name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Check generated files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Regenerate files
        run: make clean && make

      - name: Check generated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make clean && make' and commit the changes."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generation produced untracked files. Commit the generated output."
            exit 1
          fi
