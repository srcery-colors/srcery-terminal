name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Check generated files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Regenerate files
        run: make clean && make

      - name: Check generated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make clean && make' and commit the changes."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generation produced untracked files. Commit the generated output."
            exit 1
          fi
