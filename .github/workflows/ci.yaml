name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Check generated files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Regenerate files
        run: make clean && make

      - name: Check generated files
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make clean && make' and commit the changes."
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generation produced untracked files. Commit the generated output."
            exit 1
          fi
